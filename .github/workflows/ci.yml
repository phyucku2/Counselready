name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the jobs below actually need to run for this change.
  #
  # Motivation is minutes, not speed: a private repo has a finite monthly Actions
  # allowance shared across every repo on the account, and installing a Python
  # toolchain plus a Postgres service for a markdown-only pull request spends it on
  # nothing.
  #
  # Two deliberate safety properties:
  #
  #   * **Pushes to `main` always run everything.** Gating applies to pull requests
  #     only, so what sits on the default branch has been verified by the full
  #     matrix and a merge can never inherit a job that was skipped.
  #   * **Touching CI forces everything true.** A change to the workflow must be
  #     proven by the workflow.
  #
  # The secret scan is deliberately NOT gated — see its own comment.
  #
  # Filtering is plain `git diff` rather than a marketplace action: no new
  # third-party dependency to vet (CLAUDE.md §4), and on a `pull_request` the
  # checked-out ref is the merge commit, so `HEAD^1..HEAD` is exactly this PR's diff.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            changed="__ALL__"
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi

          match() {
            [ "$changed" = "__ALL__" ] && { echo true; return; }
            printf '%s\n' "$changed" | grep -Eq '^\.github/workflows/' && { echo true; return; }
            printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false
          }

          {
            echo "backend=$(match '^backend/')"
            echo "frontend=$(match '^frontend/')"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          printf '%s\n' "$changed"

  backend:
    name: Backend — lint, types, tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: counselready
          POSTGRES_PASSWORD: counselready
          POSTGRES_DB: counselready_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only credentials for the ephemeral service container above.
      # Real credentials live in Azure Key Vault and never enter this file.
      TEST_DATABASE_URL: postgresql+asyncpg://counselready:counselready@localhost:5432/counselready_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        run: pytest

      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

  frontend:
    name: Frontend — types and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Types
        run: npm ci && npx tsc --noEmit

      # The build is the gate no unit test replaces: a broken import or a bad module
      # graph surfaces here and nowhere else.
      - name: Build
        run: npx vite build

  # Deliberately NOT gated on changed paths. A committed credential can arrive in
  # any file at all, so the diff cannot be trusted to predict where to look —
  # and for a product holding court files this is the last job to economize on.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gated on the backend, which is where every scanned dependency is declared.
  licenses:
    name: Dependency licenses
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies only
        run: pip install .

      - name: Install the license scanner
        run: pip install pip-licenses

      # CLAUDE.md §6: permissive licenses only. A copyleft dependency fails the build
      # rather than being discovered at release.
      - name: Fail on copyleft licenses
        run: |
          pip-licenses --format=json > licenses.json
          python - <<'PY'
          import json
          import sys

          FORBIDDEN = ("GPL", "AGPL", "SSPL", "LGPL", "CDDL", "EPL", "MPL")
          ALLOWED_EXCEPTIONS = {"typing_extensions"}  # PSF-licensed, reported oddly

          offenders = []
          for package in json.load(open("licenses.json")):
              name = package["Name"]
              license_name = package["License"]
              if name in ALLOWED_EXCEPTIONS:
                  continue
              if any(token in license_name.upper() for token in FORBIDDEN):
                  offenders.append(f"{name}: {license_name}")

          if offenders:
              print("Forbidden licenses found:", *offenders, sep="\n  ")
              sys.exit(1)
          print("All dependency licenses are permissive.")
          PY
